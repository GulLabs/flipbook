name: Release

# Runs only after CI has gone green on `main`, against that exact commit — the
# same shape as GulLabs/any-llm, which publishes @gullabs/* today. Re-running
# the whole quality bar here would only repeat what CI just did on this SHA.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
      # Required to sign the npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Publishable packages must point at this repo, ship dist-only, and keep
      # the core dependency-free.
      - run: pnpm preflight

      # `pnpm release` builds before it publishes: both packages are
      # `files: ["dist"]`, so publishing an unbuilt workspace ships an empty
      # tarball. `prepack` covers manual publishes for the same reason.
      - name: Create Release PR or publish to npm
        uses: changesets/action@e98c6107e7918c57adc9790f48eb50a62ddc6a16 # v1.5.3
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `setup-node` writes an .npmrc that expands NODE_AUTH_TOKEN, while
          # changesets reads NPM_TOKEN. Set both, or publish fails ENEEDAUTH.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
